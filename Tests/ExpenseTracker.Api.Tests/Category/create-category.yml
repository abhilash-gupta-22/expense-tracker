info:
  name: create-category
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:{{port-number}}/api/categories
  body:
    type: json
    data: |-
      {
        "budgetId": "{{budget-id}}",
        "name": "Test Category",
        "allocatedBudget": 100.0
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setEnvVar("category-id", response.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
