info:
  name: get-category-by-id
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:{{port-number}}/api/categories/{{category-id}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves a category by id. Replace {{category-id}} with a valid GUID or set it in the collection variables.

expect:
  - status: 200
  - jsonpath:
      path: $.id
      equals: "{{category-id}}"

# Not found case
# GET http://localhost:{{port-number}}/api/categories/00000000-0000-0000-0000-000000000000
# expect: status 404
