info:
  name: get-categories-by-budget
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{port-number}}/api/categories/budget/{{budget-id}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves categories for a given budget.

expect:
  - status: 200
  - jsonpath:
      path: $[*].id
      exists: true
