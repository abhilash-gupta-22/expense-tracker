info:
  name: get-expenses-by-category
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{port-number}}/api/expenses/category/{{category-id}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves expenses for a given category.

expect:
  - status: 200
  - jsonpath:
      path: $[*].id
      exists: true
