info:
  name: get-expense-by-id
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:{{port-number}}/api/expenses/{{expense-id}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves an expense by id. Replace {{expense-id}} with a valid GUID or set it in the collection variables.

expect:
  - status: 200
  - jsonpath:
      path: $.id
      equals: "{{expense-id}}"

# Not found case can be tested with all-zero GUID
