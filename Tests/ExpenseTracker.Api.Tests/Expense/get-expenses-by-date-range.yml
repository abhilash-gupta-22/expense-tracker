info:
  name: get-expenses-by-date-range
  type: http
  seq: 4

http:
  method: GET
  url: "http://localhost:{{port-number}}/api/expenses/date-range?from={{expense-from}}&to={{expense-to}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

expect:
  - status: 200
  - jsonpath:
      path: $[*].id
      exists: true
