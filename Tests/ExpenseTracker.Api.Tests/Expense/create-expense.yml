info:
  name: create-expense
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:{{port-number}}/api/expenses
  body:
    type: json
    data: |-
      {
        "categoryId": "{{category-id}}",
        "amount": 12.5,
        "expenseDate": "2026-08-01T00:00:00Z",
        "remarks": "Test expense"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setEnvVar("expense-id", response.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
