info:
  name: get-budget-by-id
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{port-number}}/api/budgets/{{budget-id}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('budget-id')) {
          throw new Error('budget-id variable is not set; run create-budget first.');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
