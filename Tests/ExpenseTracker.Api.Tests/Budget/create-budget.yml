info:
  name: create-budget
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{port-number}}/api/budgets
  body:
    type: json
    data: |-
      {
        "month": 8,
        "year": 2026,
        "totalBudget": 80000
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setVar("budget-id", response.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
