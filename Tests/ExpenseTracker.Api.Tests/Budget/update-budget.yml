info:
  name: update-budget
  type: http
  seq: 6

http:
  method: PUT
  url: http://localhost:{{port-number}}/api/budgets/{{budget-id}}
  body:
    type: json
    data: |-
      {
        "totalBudget": 90000.00
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('budget-id')) {
          throw new Error('budget-id variable is not set; run create-budget first.');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
