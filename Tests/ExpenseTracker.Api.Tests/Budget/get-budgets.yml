info:
  name: get-budgets
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:{{port-number}}/api/budgets
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (!bru.getVar('budget-id') && Array.isArray(body) && body.length > 0) {
          bru.setVar('budget-id', body[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
