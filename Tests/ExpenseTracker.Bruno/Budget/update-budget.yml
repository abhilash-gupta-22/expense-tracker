info:
  name: Update Budget
  type: http
  seq: 9

http:
  method: PUT
  url: https://localhost:5001/api/budgets/{{budgetId}}
  headers:
    Content-Type: application/json
  body: |
    {
      "totalBudget": 1500.0
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Updates an existing budget. Replace {{budgetId}} with a real GUID or set it in the collection variables.

> expect-status 204

# Verify update
GET /budgets/{{budgetId}}
Accept: application/json
> expect-status 200
> expect-jsonpath $.totalBudget == 1500.0
