info:
  name: Get Expense By Id
  type: http
  seq: 2

http:
  method: GET
  url: https://localhost:5001/api/expenses/{{existingId}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves a single expense by id. Replace {{existingId}} with a real GUID or set it in the collection variables.
