info:
  name: Update Expense
  type: http
  seq: 4

http:
  method: PUT
  url: https://localhost:5001/api/expenses/{{existingId}}
  headers:
    Content-Type: application/json
  body: |
    {
      "amount": 20.0,
      "expenseDate": "2025-02-01T00:00:00Z",
      "remarks": "Updated via Bruno"
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Updates an existing expense. Replace {{existingId}} with a real GUID or set it in the collection variables.
