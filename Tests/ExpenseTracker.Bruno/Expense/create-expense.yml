info:
  name: Create Expense
  type: http
  seq: 3

http:
  method: POST
  url: https://localhost:5001/api/expenses
  headers:
    Content-Type: application/json
  body: |
    {
      "categoryId": "{{categoryId}}",
      "amount": 12.5,
      "expenseDate": "2025-01-01T00:00:00Z",
      "remarks": "Test expense"
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Creates a new expense. Replace {{categoryId}} with a valid category GUID or set it in the collection variables.
